<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <title>AR Sejarah Tokoh Dunia</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body>

  <div id="hint">▸ SCAN MARKER TO INITIALIZE</div>

<div id="info-panel">
  <h2 id="info-nama"></h2>
  <p id="info-meta"></p>
</div>

  <!-- Scene AR -->
  <a-scene embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; maxDetectionRate: 30; smoothPosition: true; smoothRotation: true;"
    vr-mode-ui="enabled: false"
    renderer="colorManagement: false; antialias: false; precision: low; powerPreference: high-performance;"
    loading-screen="enabled: false">

    <a-entity camera></a-entity>
  </a-scene>

  <script src="js/app.js"></script>
</body>

</html>
