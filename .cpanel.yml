---
deployment:
  tasks:
    - export DEPLOYPATH=/home/urn/public_html/marker

    # Mirror bersih: hosting identik dengan repo, file yang dihapus di repo ikut terhapus.
    # cgi-bin dan .well-known dikecualikan agar folder default hosting tetap utuh.
    - rsync -a --delete --exclude '.git' --exclude '.cpanel.yml' --exclude '.gitignore' --exclude '.clinerules' --exclude '.kilo' --exclude 'cgi-bin' --exclude '.well-known' ./ $DEPLOYPATH/
