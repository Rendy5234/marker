deployment:
  tasks:
    - export DEPLOYPATH=/home/urn/public_html/marker
    - export REPOPATH=/home/urn/repositories/nama-repo-kamu # Ganti dengan path repo di cPanel
    
    # Sinkronkan seluruh isi repositori ke folder deploy, hapus file yang tidak ada di repo
    - /bin/rsync -aP --exclude='.git' --exclude='.cpanel.yml' --exclude='.well-known' --exclude='cgi-bin' ${REPOPATH}/ ${DEPLOYPATH} --delete-after